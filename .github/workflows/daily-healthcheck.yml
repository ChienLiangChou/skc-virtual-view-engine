name: Daily Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13,14 * * *"

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install health check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run deployed app health check
        id: healthcheck
        run: python scripts/daily_healthcheck.py
        env:
          APP_URL: https://skc-virtual-view-engine.streamlit.app
          HEALTHCHECK_CUSTOMER_ID: system-healthcheck
          HEALTHCHECK_TIMEZONE: America/Toronto
          EXPECTED_LOCAL_HOUR: "9"
          REQUIRE_LOCAL_9AM: ${{ github.event_name == 'schedule' && '1' || '0' }}
          HEALTHCHECK_ARTIFACT_DIR: healthcheck-artifacts

      - name: Read health check status
        if: always()
        id: healthcheck_status
        run: |
          if [ -f healthcheck-artifacts/status.txt ]; then
            STATUS="$(tr -d '\r\n' < healthcheck-artifacts/status.txt)"
          else
            STATUS="missing"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload health check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-healthcheck-artifacts
          path: healthcheck-artifacts
          if-no-files-found: warn

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "[Healthcheck] Deployed app failed";
            const body = fs.existsSync("healthcheck-artifacts/summary.md")
              ? fs.readFileSync("healthcheck-artifacts/summary.md", "utf8")
              : "Health check failed. See workflow logs and artifacts.";

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close open failure issue after recovery
        if: success() && steps.healthcheck_status.outputs.status == 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Healthcheck] Deployed app failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Daily health check is healthy again. Closing this issue automatically.",
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
